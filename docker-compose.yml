version: '3.8'

services:
  # Nginx Reverse Proxy (Gateway)
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - nlp
      - rl
    restart: unless-stopped

  # NLP 요약 서버 (기존 GPU 서버)
  nlp:
    build:
      context: ./natural-language-processing
      dockerfile: Dockerfile
    expose:
      - "8000"
    volumes:
      # 모델 파일 마운트 (Docker 이미지에 포함되지 않음)
      - ./natural-language-processing/models:/app/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  # RL 추천 서버
  rl:
    build: &rl-build
      context: ./reinforce-learning
      dockerfile: Dockerfile
    expose:
      - "8001"
    environment:
      RECOMMENDATION_MODEL_PATH: /app/model-updates/bandit_policy_latest.pt
    volumes:
      # backend-secret root 마운트
      - ./backend-secret:/app/backend-secret:ro
      - recommendation-model:/app/model-updates:ro
    restart: unless-stopped

  rl-trainer:
    build: *rl-build
    command: ["python", "-m", "recommendation.rl.trainer.scheduled"]
    environment:
      RECOMMENDATION_MODEL_PATH: /app/model-updates/bandit_policy_latest.pt
      RECOMMENDATION_TRAIN_INTERVAL_SECONDS: ${RECOMMENDATION_TRAIN_INTERVAL_SECONDS:-86400}
      RECOMMENDATION_TRAIN_MIN_SAMPLES: ${RECOMMENDATION_TRAIN_MIN_SAMPLES:-200}
      RECOMMENDATION_TRAIN_MIN_PER_LABEL: ${RECOMMENDATION_TRAIN_MIN_PER_LABEL:-20}
    volumes:
      - ./backend-secret:/app/backend-secret:ro
      - recommendation-model:/app/model-updates
    restart: unless-stopped

volumes:
  recommendation-model:
